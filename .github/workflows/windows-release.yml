name: Build Windows release

on: workflow_dispatch

permissions:
  actions: read
  contents: write

jobs:
  attach-v0-3-57-assets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: "453912638"
      BUILD_RUN_ID: "44938265455"
      RELEASE_TAG: v0.3.57
      RELEASE_COMMIT: 327a1cf7724132cd35d91ebc2be98a2a8fe89b63
    steps:
      - name: Check release and build provenance
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" |
            jq -e --arg commit "$RELEASE_COMMIT" '.head_sha == $commit and .conclusion == "success"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft and .target_commitish == "main"' >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: gm-market-bot-windows-main
          path: windows-assets
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify and attach Windows assets
        working-directory: windows-assets
        run: |
          mv "GM Market Bot Setup 0.3.57.exe" GM-Market-Bot-Setup-0.3.57.exe
          mv "GM Market Bot Setup 0.3.57.exe.blockmap" GM-Market-Bot-Setup-0.3.57.exe.blockmap
          sha256sum --check <<'HASHES'
          ca54f9bfbe0c239c4c5b1367d28655c91faf8240c1aa10730838d56feac86936  GM-Market-Bot-Setup-0.3.57.exe
          7feddabadc25fc1345953a81545ae3f60f04c8223267e9e434ef7d82ddffa708  GM-Market-Bot-Setup-0.3.57.exe.blockmap
          2ebe54c836c0c3e30788367b3055c4e2ef68287ceb4e82d7c8169fdb23ca0e08  latest.yml
          HASHES
          release_endpoint="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          for name in GM-Market-Bot-Setup-0.3.57.exe GM-Market-Bot-Setup-0.3.57.exe.blockmap latest.yml; do
            digest="sha256:$(sha256sum "$name" | cut -d " " -f 1)"
            asset_state="$(gh api "$release_endpoint" | jq -r --arg name "$name" --arg digest "$digest" '[.assets[] | select(.name == $name) | (.state == "uploaded" and .digest == $digest)] | if length == 0 then "missing" elif . == [true] then "verified" else "conflict" end')"
            case "$asset_state" in
              verified) continue ;;
              conflict) echo "Draft contains a different asset named $name" >&2; exit 1 ;;
            esac
            gh api --method POST -H 'Content-Type: application/octet-stream' --input "$name" \
              "https://uploads.github.com/$release_endpoint/assets?name=$name" |
              jq -e --arg name "$name" --arg digest "$digest" '.name == $name and .state == "uploaded" and .digest == $digest' >/dev/null
          done
      - name: Create tag at the tested release commit
        run: |
          tag_endpoint="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          if ! gh api "$tag_endpoint" > release-tag.json 2>/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" > release-tag.json
          fi
          jq -e --arg commit "$RELEASE_COMMIT" '.object.type == "commit" and .object.sha == $commit' release-tag.json >/dev/null
